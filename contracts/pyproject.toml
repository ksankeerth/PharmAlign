[project]
name = "pharmalign-contracts"
version = "1.0.0"
description = "Request and result models shared by the PharmAlign server and agents"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = ["fastapi>=0.115", "pyyaml>=6", "openapi-spec-validator>=0.7", "pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pharmalign_contracts*"]
