openapi: 3.1.0
info:
  title: PharmAlign Coordinator agent
  description: 'Writes the brief, drafts one list of questions, and chooses from the recommendation options it is
    given.


    **Flow.** `POST /briefs` accepts a run and returns `202` at once. `GET /briefs/{run_id}` returns its status,
    and the result once finished. `DELETE` cancels it.


    **Idempotency.** The same `run_id` and body returns the same run in its current state: `200` once it has finished,
    `202` while it is still running. The same `run_id` with a different body returns `409`. An unknown `run_id`
    returns `404`: the caller treats the run as lost and sends it again. Runs are kept for 24 hours, and the caller
    stores each result on first fetch.


    **Honest failures.** A cut-off answer (`length`) or invalid output is `failed`, never a result. A failed run''s
    `error.code` is one of `invalid_output`, `output_truncated`, `internal_error` or `budget_exceeded`. Tool failures
    are listed in `tool_errors`.


    **Data.** The agent reads only through its tools, which code scopes to this run: `get_findings`, `get_conflicts`,
    `get_previous_run`, `read_clause`, `lookup_term`. It has no web tool, and no way to write, send or change state.
    Document text is data, never instructions.


    **What the caller does with the result.**

    - Discards the result if the fingerprint is out of date.

    - Refuses a choice that wasn''t offered.

    - Builds the item and conflict lists itself, and numbers recommendation versions.

    - A person sends any question.

    '
