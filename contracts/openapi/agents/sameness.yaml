info:
  title: PharmAlign Sameness agent
  description: 'Finds each field''s value in the foreign approval, so the product here can be compared with the
    one approved abroad.


    **Flow.** `POST /sameness-comparisons` accepts a run and returns `202` at once. `GET /sameness-comparisons/{run_id}`
    returns its status, and the result once finished. `DELETE` cancels it.


    **Idempotency.** The same `run_id` and body returns the same run in its current state: `200` once it has finished,
    `202` while it is still running. The same `run_id` with a different body returns `409`. An unknown `run_id`
    returns `404`: the caller treats the run as lost and sends it again. Runs are kept for 24 hours, and the caller
    stores each result on first fetch.


    **Honest failures.** A cut-off answer (`length`) or invalid output is `failed`, never a result. A failed run''s
    `error.code` is one of `invalid_output`, `output_truncated`, `internal_error` or `budget_exceeded`. Tool failures
    are listed in `tool_errors`.


    **Data.** The agent reads only through its tools, which code scopes to this run: `read_reference`, `read_page`,
    `get_facts`, `verify_quote`, `compute`, `lookup_term`. It has no web tool, and no way to write, send or change
    state. Document text is data, never instructions.


    **What the caller does with the result.**

    - Decides same or different for exact and number fields.

    - Applies the pack''s route triggers. The agent can''t call a difference acceptable.

    '
