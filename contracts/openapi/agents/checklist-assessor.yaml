openapi: 3.1.0
info:
  title: PharmAlign Checklist Assessor agent
  description: 'Handles one check per run. For an `agent` check it reads the law and the file. For a `typed` check
    it only extracts values.


    **Flow.** `POST /assessments` accepts a run and returns `202` at once. `GET /assessments/{run_id}` returns its
    status, and the result once finished. `DELETE` cancels it.


    **Idempotency.** The same `run_id` and body returns the same run in its current state: `200` once it has finished,
    `202` while it is still running. The same `run_id` with a different body returns `409`. An unknown `run_id`
    returns `404`: the caller treats the run as lost and sends it again. Runs are kept for 24 hours, and the caller
    stores each result on first fetch.


    **Honest failures.** A cut-off answer (`length`) or invalid output is `failed`, never a result. A failed run''s
    `error.code` is one of `invalid_output`, `output_truncated`, `internal_error` or `budget_exceeded`. Tool failures
    are listed in `tool_errors`.


    **Data.** The agent reads only through its tools, which code scopes to this run: `search_kb`, `read_clause`,
    `get_doc_status`, `read_page`, `read_table`, `search_dossier`, `get_facts`, `get_site`, `verify_quote`, `compute`,
    `lookup_term`. It has no web tool, and no way to write, send or change state. Document text is data, never instructions.


    **What the caller does with the result.**

    - Runs the rule for typed checks.

    - Decides the check status. A finding of met may still need a person to confirm.

    - Refuses met without a verified quote from the knowledge base.

    - Creates a gap candidate when `no_source` is set.

    '
  version: 1.5.0
