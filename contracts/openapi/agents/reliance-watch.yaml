openapi: 3.1.0
info:
  title: PharmAlign Reliance Watch agent
  description: 'Explains what a foreign regulator''s notice means for licences and cases that relied on it. Code
    has already alerted a person.


    **Flow.** `POST /notice-assessments` accepts a run and returns `202` at once. `GET /notice-assessments/{run_id}`
    returns its status, and the result once finished. `DELETE` cancels it.


    **Idempotency.** The same `run_id` and body returns the same run in its current state: `200` once it has finished,
    `202` while it is still running. The same `run_id` with a different body returns `409`. An unknown `run_id`
    returns `404`: the caller treats the run as lost and sends it again. Runs are kept for 24 hours, and the caller
    stores each result on first fetch.


    **Honest failures.** A cut-off answer (`length`) or invalid output is `failed`, never a result. A failed run''s
    `error.code` is one of `invalid_output`, `output_truncated`, `internal_error` or `budget_exceeded`. Tool failures
    are listed in `tool_errors`.


    **Data.** The agent reads only through its tools, which code scopes to this run: `read_notice`, `list_recent_notices`,
    `get_relied_on`, `get_licence`, `search_kb`, `read_clause`, `verify_quote`, `compute`. It has no web tool, and
    no way to write, send or change state. Document text is data, never instructions.


    **What the caller does with the result.**

    - Keeps severity at or above the floor.

    - Decides what re-runs. `additional_checks` can only add to that list.

    - Stores the notice even if nothing matches.

    '
  version: 1.5.0
