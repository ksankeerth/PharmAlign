openapi: 3.1.0
info:
  title: PharmAlign Challenger agent
  description: 'Tries to disprove an important finding, usually with a stronger model. It never overwrites a finding.


    **Flow.** `POST /challenges` accepts a run and returns `202` at once. `GET /challenges/{run_id}` returns its
    status, and the result once finished. `DELETE` cancels it.


    **Idempotency.** The same `run_id` and body returns the same run in its current state: `200` once it has finished,
    `202` while it is still running. The same `run_id` with a different body returns `409`. An unknown `run_id`
    returns `404`: the caller treats the run as lost and sends it again. Runs are kept for 24 hours, and the caller
    stores each result on first fetch.


    **Honest failures.** A cut-off answer (`length`) or invalid output is `failed`, never a result. A failed run''s
    `error.code` is one of `invalid_output`, `output_truncated`, `internal_error` or `budget_exceeded`. Tool failures
    are listed in `tool_errors`.


    **Data.** The agent reads only through its tools, which code scopes to this run: `read_clause`, `search_kb`,
    `get_doc_status`, `read_page`, `search_dossier`, `read_reference`, `verify_quote`, `compute`. It has no web
    tool, and no way to write, send or change state. Document text is data, never instructions.


    **What the caller does with the result.**

    - Treats a dispute as cannot_verify unless its quote is verified and differs from the claim''s evidence.

    - A dispute that stands sets the check to Person confirms.

    '
  version: 1.6.0
