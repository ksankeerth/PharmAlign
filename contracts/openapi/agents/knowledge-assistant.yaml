openapi: 3.1.0
info:
  title: PharmAlign Knowledge Assistant agent
  description: 'Answers questions from the knowledge base for anyone: laws, guidelines and the country''s pack.
    Given a case, it also knows that case. It explains, and doesn''t decide.


    **Flow.** `POST /sessions` creates a session scoped to one person. With a `case_id` it is also scoped to that
    case. Without one it is knowledge-only. `POST /sessions/{agent_session_id}/turns` answers one message as server-sent
    events. Each event is one line, `data: {json}`, followed by a blank line, and the JSON is an `AssistantEvent`
    that carries its own `type`. There is no `event:` line. The stream ends when the agent closes it. Errors before
    the stream starts are problem JSON.


    **Budget.** One turn may use 12 model calls, 20 tool calls and 90 seconds. Past any of these the turn ends with
    a retryable `error` event (`budget_exceeded` or `deadline_exceeded`).


    **Answers.** A `message` cites passages by anchor and quote. The caller checks each quote and labels it with
    the document title and legal status. When nothing qualifies, the agent sends `no_source` with the searches it
    tried, and doesn''t answer from memory. It may suggest follow-up questions.


    **Rules.** It says when something wasn''t checked or wasn''t saved. It can''t change a status, waive a check,
    send anything or advise promoting. `draft_comment` is posted only when a person confirms it. Sessions live in
    memory, so after a restart the caller starts a new one.


    **Data.** It reads only through its tools, which code scopes to this person, and to the case if there is one.
    A knowledge-only session gets only `search_kb`, `get_doc_status`, `read_clause`, `lookup_term`, `read_notice`.
    A case session gets all of: `search_kb`, `get_doc_status`, `read_clause`, `lookup_term`, `read_notice`, `get_facts`,
    `get_findings`, `get_conflicts`, `get_previous_run`, `get_check`, `compare_pack`, `read_page`, `read_reference`,
    `get_run_trace`, `draft_comment`.

    '
