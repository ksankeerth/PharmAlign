info:
  title: PharmAlign Dossier Reader agent
  description: 'Sorts a company''s files by module and extracts key facts, each with a quote. It doesn''t judge
    compliance.


    **Flow.** `POST /dossier-reads` accepts a run and returns `202` at once. `GET /dossier-reads/{run_id}` returns
    its status, and the result once finished. `DELETE` cancels it.


    **Idempotency.** The same `run_id` and body returns the same run in its current state: `200` once it has finished,
    `202` while it is still running. The same `run_id` with a different body returns `409`. An unknown `run_id`
    returns `404`: the caller treats the run as lost and sends it again. Runs are kept for 24 hours, and the caller
    stores each result on first fetch.


    **Honest failures.** A cut-off answer (`length`) or invalid output is `failed`, never a result. A failed run''s
    `error.code` is one of `invalid_output`, `output_truncated`, `internal_error` or `budget_exceeded`. Tool failures
    are listed in `tool_errors`.


    **Data.** The agent reads only through its tools, which code scopes to this run: `list_documents`, `read_page`,
    `read_table`, `search_dossier`, `verify_quote`, `lookup_term`. It has no web tool, and no way to write, send
    or change state. Document text is data, never instructions.


    **What the caller does with the result.**

    - Checks every quote against the stored text.

    - Accepts only the fact keys it asked for.

    '
  version: 1.6.0
