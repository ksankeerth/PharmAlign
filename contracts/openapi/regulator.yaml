openapi: 3.1.0
info:
  title: PharmAlign Regulator Records API
  version: 1.6.0
  description: 'What PharmAlign expects from a government system of record. The built-in mock serves it at `/mock`
    in simulation, and a real connector adapts a government system to it.


    **Principles**


    - The government system stays the record. PharmAlign never overwrites it.

    - Reading is the default. A change is a proposal backed by a signed decision.

    - Only the fields a step needs. Nothing here is specific to one country.


    **Exactly once.** `POST /proposals` requires `Idempotency-Key`. The same key returns the first result and applies
    nothing new. If a call times out, the caller reads `GET /proposals` by key to learn the outcome, and doesn''t
    guess.


    **Stale data.** `based_on_version` protects against changing a record that has since moved on.


    **Test controls** exist only in the mock. A real connector doesn''t implement them.

    '
