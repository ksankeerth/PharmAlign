components:
  schemas:
    Adoption:
      additionalProperties: false
      properties:
        adopted:
          default: true
          title: Adopted
          type: boolean
        legal_status:
          enum:
          - in_force
          - draft
          - superseded
          - review_needed
          - not_applicable
          title: Legal Status
          type: string
        authority_level:
          description: 1 is binding law. 5 is context only.
          maximum: 5
          minimum: 1
          title: Authority Level
          type: integer
        notes:
          anyOf:
          - maxLength: 2000
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Notes
        workspace_id:
          maxLength: 128
          minLength: 1
          title: Workspace Id
          type: string
        document_version_id:
          maxLength: 128
          minLength: 1
          title: Document Version Id
          type: string
        decided_by:
          maxLength: 128
          minLength: 1
          title: Decided By
          type: string
        decided_at:
          format: date-time
          title: Decided At
          type: string
      required:
      - legal_status
      - authority_level
      - workspace_id
      - document_version_id
      - decided_by
      - decided_at
      title: Adoption
      type: object
    AdoptionPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Adoption'
          title: Items
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Pass as `cursor` for the next page. Null on the last page.
          title: Next Cursor
      required:
      - items
      title: AdoptionPage
      type: object
    AdoptionUpdate:
      additionalProperties: false
      description: 'Per country: the same shared document can hold a different status elsewhere.'
      properties:
        adopted:
          default: true
          title: Adopted
          type: boolean
        legal_status:
          enum:
          - in_force
          - draft
          - superseded
          - review_needed
          - not_applicable
          title: Legal Status
          type: string
        authority_level:
          description: 1 is binding law. 5 is context only.
          maximum: 5
          minimum: 1
          title: Authority Level
          type: integer
        notes:
          anyOf:
          - maxLength: 2000
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Notes
      required:
      - legal_status
      - authority_level
      title: AdoptionUpdate
      type: object
    AgentHealthView:
      additionalProperties: false
      properties:
        agent:
          pattern: ^[a-z][a-z0-9_-]{0,63}$
          title: Agent
          type: string
        status:
          enum:
          - ok
          - degraded
          - down
          title: Status
          type: string
        version:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Version
        contract_version:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Contract Version
        models_available:
          default: 0
          title: Models Available
          type: integer
        models_total:
          default: 0
          title: Models Total
          type: integer
        last_success_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          title: Last Success At
        failures_last_hour:
          default: 0
          title: Failures Last Hour
          type: integer
      required:
      - agent
      - status
      title: AgentHealthView
      type: object
    AgentHealthViewPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/AgentHealthView'
          title: Items
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Pass as `cursor` for the next page. Null on the last page.
          title: Next Cursor
      required:
      - items
      title: AgentHealthViewPage
      type: object
    AgentRunView:
      additionalProperties: false
      description: Numbers and ids only. Holds no dossier content.
      properties:
        run_id:
          maxLength: 128
          minLength: 1
          title: Run Id
          type: string
        agent:
          pattern: ^[a-z][a-z0-9_-]{0,63}$
          title: Agent
          type: string
        case_id:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Case Id
        check_id:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Check Id
        status:
          enum:
          - queued
          - running
          - completed
          - stopped_early
          - failed
          - cancelled
          - lost
          title: Status
          type: string
        finish_reason:
          anyOf:
          - pattern: ^[a-z][a-z0-9_-]{0,63}$
            type: string
          - type: 'null'
          default: null
          title: Finish Reason
        generation:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Generation
        attempt:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Attempt
        is_current:
          default: true
          title: Is Current
          type: boolean
        duration_ms:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Duration Ms
        usage:
          anyOf:
          - $ref: '#/components/schemas/Usage'
          - type: 'null'
          default: null
        fallback_used:
          default: false
          title: Fallback Used
          type: boolean
        error_code:
          anyOf:
          - pattern: ^[a-z][a-z0-9_-]{0,63}$
            type: string
