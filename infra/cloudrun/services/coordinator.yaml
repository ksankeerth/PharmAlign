# coordinator: Cloud Run service. Fill the placeholders with envsubst (see README.md).
# Only the server's service account may call it (invoker policy, set after deploy). No secrets here.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: pharmalign-coordinator
  labels:
    cloud.googleapis.com/location: ${REGION}
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/invoker-iam-disabled: "false"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        # A run goes on in the background between polls, so CPU stays on while an instance is up.
        run.googleapis.com/cpu-throttling: "false"
    spec:
      serviceAccountName: pharmalign-agent@${PROJECT_ID}.iam.gserviceaccount.com
      containerConcurrency: 8
      timeoutSeconds: 300
      containers:
        - image: ${REGION}-docker.pkg.dev/${PROJECT_ID}/pharmalign/coordinator:${TAG}
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            - name: PHARMALIGN_MODEL_MODE
              value: vertex
            - name: PHARMALIGN_MCP_URL
              value: ${SERVER_URL}/mcp
            - name: PHARMALIGN_OTEL_TO_CLOUD
              value: "true"
            - name: GOOGLE_CLOUD_PROJECT
              value: ${PROJECT_ID}
            - name: GOOGLE_CLOUD_LOCATION
              value: global
          startupProbe:
            httpGet:
              path: /health
            periodSeconds: 5
            failureThreshold: 24
