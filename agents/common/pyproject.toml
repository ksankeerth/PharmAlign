[project]
name = "pharmalign-agent-common"
version = "0.1.0"
description = "Shared runtime for the PharmAlign agents: contract routes, ADK runner, output control, test kit"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pharmalign-contracts",
    "google-adk[mcp]>=2.12.0,<3.0.0",
    "mcp>=1.24,<2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.26", "httpx>=0.27"]

[tool.uv.sources]
pharmalign-contracts = { path = "../../contracts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pharmalign_agent_common"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
